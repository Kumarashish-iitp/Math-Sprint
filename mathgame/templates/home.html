{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>Math Sprint</title>
    <link rel="stylesheet" href="{% static 'home.css' %}">
</head>

<body>
    <div class="header">
        <h1>Math Sprint</h1>
        <p>Test Your Math Skills &amp; Improve Your Calculation Speed</p>
    </div>
    <div class="container">
        <form method="post"  action="{% url 'quiz' %}">
            {% csrf_token %}

            <div class="difficulty">
                <h3>DIFFICULTY</h3>
                <div class="level-box">
                    <label>
                        <input type="radio" name="difficulty" value="easy" checked>
                        Easy
                    </label>
                    <label>
                        <input type="radio" name="difficulty" value="medium">
                        Medium
                    </label>
                    <label>
                        <input type="radio" name="difficulty" value="hard">
                        Hard
                    </label>
                </div>
            </div>
            <div class="operations">
                <h3>OPERATIONS</h3>
                <div class="operation-box">
                    <label>
                        <input type="radio" name="operation" value="addition" checked>
                        Addition
                    </label>
                    <label>
                        <input type="radio" name="operation" value="subtraction">
                        Subtraction
                    </label>
                    <label>
                        <input type="radio" name="operation" value="multiplication">
                        Multiplication
                    </label>
                    <label>
                        <input type="radio" name="operation" value="division">
                        Division
                    </label>
                    <label>
                        <input type="radio" name="operation" value="mixed">
                        All Operations
                    </label>
                </div>
            </div>
            <div class="question-count">
                <h3>NUMBER OF QUESTIONS</h3>
                <select name="total_questions">
                    <option value="10">10 Questions</option>
                    <option value="15">15 Questions</option>
                    <option value="20">20 Questions</option>
                </select>
            </div>
            
            <div class="start">
                <button type="submit">Start</button>
            </div>
        </form>
    </div>
    <div class="footer"> 
        <p>Math Sprint © 2026 | Practice. Improve. Excel.</p>
    </div>
</body>

</html>
